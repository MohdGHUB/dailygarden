<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Daily Garden">
<meta name="theme-color" content="#FBF6EC">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>Daily Garden</title>
<style>
:root{
  --bg:#FBF6EC; --ink:#1E1B16; --soft:#5E5648; --card:#FFFFFF; --line:#D8CCB6;
  --green:#2F6B3A; --green2:#3F8A4C; --greenDark:#1F4A27; --gold:#F2B705;
  --blue:#2457A6; --done:#E4F1E0; --rose:#C8465B; --roseDark:#8F2F40;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,Arial,sans-serif;
  overscroll-behavior:none;touch-action:manipulation}
body{position:fixed;inset:0;overflow:hidden}
button{font-family:inherit;color:inherit;cursor:pointer}
.emo,.pcell,.slot .se,.startIcon,.garden,.minigarden,.pbig{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}

.screen{position:absolute;inset:0;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 16px calc(env(safe-area-inset-bottom) + 16px)}
.screen.on{display:flex}

/* Hidden caregiver corner: hold for 3 seconds */
#corner{position:fixed;top:0;right:0;width:76px;height:calc(env(safe-area-inset-top) + 76px);z-index:60}

/* Home */
.hdr{display:flex;align-items:baseline;gap:6px;font-size:17px;color:var(--soft);font-weight:600;min-height:28px}
.ver{font-size:11px;opacity:.45;font-weight:500}
.hello{text-align:center;margin-top:3vh}
.greet{font-size:40px;font-weight:800;line-height:1.1}
.sub{font-size:24px;color:var(--soft);margin-top:10px;line-height:1.3}
.start{flex:1;max-height:44vh;min-height:200px;margin:4vh 0 3vh;border:0;border-radius:36px;background:var(--green);color:#fff;
  font-size:54px;font-weight:800;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  box-shadow:0 10px 0 var(--greenDark)}
.start:active{transform:translateY(6px);box-shadow:0 4px 0 var(--greenDark)}
.startIcon{font-size:96px;line-height:1}
.minigarden{text-align:center;font-size:30px;letter-spacing:2px;line-height:1.3}
.gnote{font-size:20px;color:var(--soft);text-align:center;margin-top:6px}

/* Play */
.topbar{display:flex;align-items:center;gap:14px;height:68px;padding-right:66px}
.say{width:76px;height:62px;border-radius:20px;border:3px solid var(--line);background:var(--card);font-size:32px;box-shadow:0 4px 0 var(--line)}
.say:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.dots{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--line)}
.dot.done{background:var(--green2)}
.dot.now{background:var(--gold);transform:scale(1.25)}
.prompt{font-size:30px;font-weight:750;line-height:1.25;text-align:center;margin:8px 4px 14px;min-height:76px;display:flex;align-items:center;justify-content:center}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:14px}
.grid{flex:1;min-height:0;display:grid;gap:14px}
.g2x1{grid-template-columns:1fr 1fr;grid-template-rows:1fr}
.g1x3{grid-template-columns:1fr;grid-template-rows:repeat(3,1fr)}
.g2x2{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.g2x3{grid-template-columns:1fr 1fr;grid-template-rows:repeat(3,1fr)}

.card{position:relative;border:4px solid var(--line);border-radius:26px;background:var(--card);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;padding:6px;
  min-height:0;min-width:0;overflow:hidden;box-shadow:0 4px 0 var(--line);transition:transform .15s,background .3s,opacity .4s}
button.card:active{transform:scale(.97)}
.emo{font-size:min(17vw,9vh);line-height:1.1}
.lbl{font-size:24px;font-weight:700;line-height:1.1;text-align:center}
.g1x3 .card{flex-direction:row;gap:18px;justify-content:flex-start;padding-left:22px}
.g1x3 .emo{font-size:min(15vw,8vh)}
.g1x3 .lbl{font-size:28px;text-align:start}
[dir=rtl] .g1x3 .card{padding-left:6px;padding-right:22px}
[dir=rtl] .lbl{font-size:26px}
[dir=rtl] .prompt{font-size:32px}
.card.sel{border-color:var(--blue);box-shadow:0 0 0 5px var(--blue)}
.card.right{border-color:var(--green2);background:var(--done)}
.card.matched{border-color:var(--green2);background:var(--done);opacity:.6}
.card.matched::after{content:"\2713";position:absolute;top:4px;right:12px;font-size:30px;font-weight:800;color:var(--green)}
.card.used{visibility:hidden}
.card.down{background:#7FA879;border-color:#5C8656;box-shadow:0 4px 0 #5C8656}
.card.down > *{visibility:hidden}
.card.down::before{content:"\1F33F";position:absolute;font-size:52px}
.card.photo{padding:0}
.card.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card.photo .lbl{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.88);padding:6px 4px;font-size:22px}
.g1x3 .card.photo{padding:0}

.glow{animation:glow 1.4s ease-in-out infinite;border-color:var(--gold)!important}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(242,183,5,0)}50%{box-shadow:0 0 0 12px rgba(242,183,5,.55)}}

/* Goes together */
.tgtRow{flex:0 0 30%;display:flex;align-items:center;justify-content:center;gap:12px;min-height:0}
.tgtRow .card{width:56%;height:100%;box-shadow:none;border-style:solid}
.plusq{font-size:44px;font-weight:800;color:var(--soft)}

/* Pattern */
.prow{display:flex;justify-content:center;gap:5px;flex-wrap:nowrap;padding:6px 0 4px}
.pcell{width:min(13vw,62px);height:min(13vw,62px);flex:0 0 auto;border-radius:16px;background:var(--card);border:3px solid var(--line);
  display:flex;align-items:center;justify-content:center;font-size:min(9vw,40px)}
.pcell.q{border-style:dashed;border-color:var(--gold);border-width:4px;font-family:inherit;font-weight:800;color:var(--soft)}
.pcell.q.filled{border-style:solid;border-color:var(--green2);background:var(--done);font-family:"Apple Color Emoji","Segoe UI Emoji",sans-serif}

/* Sequence */
.slots{display:flex;gap:8px;justify-content:center}
.slot{flex:1;max-width:88px;height:96px;border:3px dashed var(--line);border-radius:16px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;font-size:28px;color:var(--soft);font-weight:800;background:rgba(255,255,255,.55)}
.slot.full{border-style:solid;border-color:var(--green2);background:var(--done);color:var(--ink)}
.slot .se{font-size:min(10vw,42px);line-height:1.1}
.slot .sn{font-size:15px}

/* Photos */
.bigphoto{flex:1;min-height:0;border-radius:26px;overflow:hidden;border:4px solid var(--line);background:#eee}
.bigphoto img{width:100%;height:100%;object-fit:cover;display:block}
.pname{font-size:38px;font-weight:800;text-align:center}
.heart{height:108px;flex:0 0 108px;border-radius:30px;border:4px solid transparent;background:var(--rose);color:#fff;font-size:36px;font-weight:800;box-shadow:0 8px 0 var(--roseDark)}
.heart:active{transform:translateY(5px);box-shadow:0 3px 0 var(--roseDark)}

/* Praise overlay */
.praise{position:fixed;inset:0;background:rgba(251,246,236,.95);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:40}
.praise.on{display:flex}
.pbig{font-size:130px;line-height:1;animation:pop .7s ease-out}
.ptext{font-size:50px;font-weight:800;color:var(--green);margin-top:18px}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12);opacity:1}100%{transform:scale(1)}}

/* End */
.endT{font-size:46px;font-weight:800;text-align:center;margin-top:3vh}
.endS{font-size:24px;color:var(--soft);text-align:center;margin-top:8px;line-height:1.3}
.garden{flex:1;min-height:0;display:flex;flex-wrap:wrap;align-content:flex-end;justify-content:center;gap:4px 8px;font-size:46px;
  background:linear-gradient(#FBF6EC 0%,#EAF2DC 70%,#CFE2B8 100%);border-radius:30px;margin:3vh 0;padding:16px;overflow:hidden}
.garden .new{animation:grow 1.8s ease-out}
@keyframes grow{0%{transform:scale(0) translateY(30px);opacity:0}60%{transform:scale(1.25)}100%{transform:scale(1);opacity:1}}
.big{height:112px;flex:0 0 112px;border:0;border-radius:30px;background:var(--green);color:#fff;font-size:44px;font-weight:800;box-shadow:0 8px 0 var(--greenDark)}
.big:active{transform:translateY(5px);box-shadow:0 3px 0 var(--greenDark)}

/* Caregiver */
#care{background:#fff;overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(env(safe-area-inset-bottom) + 40px)}
#care.on{display:block}
#care, #care *{-webkit-user-select:text;user-select:text}
#care h1{font-size:24px;margin:8px 0 2px}
#care h2{font-size:19px;margin:0 0 8px}
#care p,.note{font-size:16px;color:#554c3f;line-height:1.45;margin:6px 0}
.cs{border:1px solid #E5DCCB;border-radius:14px;padding:14px;margin:14px 0;background:#FFFDF8}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid #F0E9DC;font-size:17px}
.row:last-child{border-bottom:0}
.row label{display:flex;align-items:center;gap:10px}
.row input[type=checkbox]{width:24px;height:24px}
select,#care input[type=text]{font-size:17px;padding:8px 10px;border-radius:10px;border:1px solid #CFC3AD;background:#fff;color:var(--ink)}
.btn{font-size:17px;padding:11px 16px;border-radius:12px;border:1px solid #CFC3AD;background:#F7F2E8;margin:4px 6px 4px 0}
.btn.pri{background:var(--green);color:#fff;border-color:var(--green)}
.btn.bad{color:#A33}
.btn.wide{width:100%;font-size:20px;padding:16px;font-weight:700}
.ph{display:flex;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid #F0E9DC}
.ph img{width:60px;height:60px;object-fit:cover;border-radius:12px;flex:0 0 60px}
.ph .nm{flex:1;font-size:18px;font-weight:600}
.phform{margin-top:10px;display:flex;flex-direction:column;gap:10px}
.phform img{width:140px;height:140px;object-fit:cover;border-radius:14px}
.bars{display:flex;gap:4px;align-items:flex-end;height:90px;margin-top:8px}
.bcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.bar{width:100%;background:var(--green2);border-radius:4px 4px 0 0;min-height:2px}
.bday{font-size:11px;color:#8a806f;margin-top:3px}
ol.tips{padding-left:20px;margin:6px 0}
ol.tips li{font-size:16px;line-height:1.45;margin:6px 0;color:#3d362c}

@media (prefers-reduced-motion:reduce){
  .glow{animation:none;box-shadow:0 0 0 8px rgba(242,183,5,.6)}
  .pbig,.garden .new{animation:none}
}
</style>
</head>
<body>

<div id="corner" aria-hidden="true"></div>

<!-- HOME -->
<section id="home" class="screen on">
  <header class="hdr"><span id="appName">Daily Garden</span><span class="ver">v1.1</span></header>
  <div class="hello">
    <div id="greet" class="greet">Hello</div>
    <div id="subT" class="sub">Ready for some gentle games?</div>
  </div>
  <button id="startBtn" class="start" aria-label="Start"><span class="startIcon">🌷</span><span id="startT">Start</span></button>
  <div id="homeGarden" class="minigarden"></div>
  <div id="homeNote" class="gnote"></div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="topbar">
    <button id="sayBtn" class="say" aria-label="Hear it again">🔊</button>
    <div id="dots" class="dots"></div>
  </div>
  <div id="prompt" class="prompt"></div>
  <div id="stage" class="stage"></div>
</section>

<!-- PRAISE -->
<div id="praise" class="praise"><div id="picon" class="pbig">🌟</div><div id="ptext" class="ptext">Wonderful!</div></div>

<!-- END -->
<section id="end" class="screen">
  <div id="endT" class="endT">You did it!</div>
  <div id="endS" class="endS">A new flower grew in your garden.</div>
  <div id="garden" class="garden"></div>
  <button id="doneBtn" class="big">Done</button>
</section>

<!-- CAREGIVER -->
<section id="care" class="screen" dir="ltr" lang="en">
  <h1>Family settings <span class="ver">v1.1</span></h1>
  <p>This page is for family only. She will not see it unless someone holds the top right corner for 3 seconds.</p>
  <button id="careBack" class="btn pri wide">Back to her app</button>
  <div id="careBody"></div>
  <button id="careBack2" class="btn pri wide">Back to her app</button>
</section>

<input id="photoFile" type="file" accept="image/*" hidden>

    VOICE = null;
    for(var i=0;i<pref.length && !VOICE;i++){ for(var j=0;j<en.length;j++){ if(en[j].name.indexOf(pref[i])===0){ VOICE=en[j]; break; } } }

}
function say(text, cb){

  if(!S.settings.speech || !window.speechSynthesis || !text){ if(cb) setTimeout(fin,500); return; }
  try{

    var u = new SpeechSynthesisUtterance(text);
    if(VOICE){ u.voice=VOICE; u.lang=VOICE.lang; } else { u.lang = (LANG==='ar') ? 'ar-SA' : 'en-GB'; }
    u.rate = S.settings.rate; u.pitch = 1; u.volume = 1;

  function match(a,b){
    a._m=b._m=true;
    [a,b].forEach(function(x){ x.classList.remove('sel','down','glow'); x.classList.add('matched'); });
    stepOk(); left--;
    if(left===0){ if(down) me.tries=Math.max(0, me.tries-1); roundDone(); }
    else { softChime(); say(pick(T('pairYes'))); }
  }
  function tapUp(b){
    tick();
    if(!sel){ sel=b; b.classList.add('sel'); say(F('pairSel',b._n)); return; }
    if(b===sel) return;
    if(b._k===sel._k){ var a=sel; sel=null; match(a,b); } else miss();
  }
  function tapDown(b){
    if(open.length>=2 || open.indexOf(b)>=0) return;
    tick(); b.classList.remove('down'); open.push(b); say(b._n);
    if(open.length===2){
      var a=open[0], c=open[1];
      if(a._k===c._k){ open=[]; busy=true; setTimeout(function(){ busy=false; match(a,c); }, 500); }
      else {
        me.tries++; me.st++; busy=true;
        setTimeout(function(){ a.classList.add('down'); c.classList.add('down'); open=[]; busy=false; if(me.st>=2){ me.st=0; peek(); } }, 1500);
      }
    }
  }
  function peek(){
    if(open.length || me.done) return;
    busy=true; say(T('peek'));
    cards.forEach(function(x){ if(!x._m) x.classList.remove('down'); });
    setTimeout(function(){ cards.forEach(function(x){ if(!x._m) x.classList.add('down'); }); busy=false; }, 2600);
  }
  me.hint = function(l){
    if(down){ if(l>=2) peek(); return; }
    var a = sel || firstOpen(); if(!a) return; var t = twin(a);
    glow(sel ? [t] : [a,t]);
    if(l>=2) say(T('pairHint'));
    if(l>=3) setTimeout(function(){
      if(R!==me || me.done || !t || t._m) return;
      if(sel && sel!==a){ sel.classList.remove('sel'); }
      sel=null; a.classList.remove('sel'); match(a,t);
    }, 2600);
  };
  ask(down ? T('pairsDown') : T('pairsUp'), down ? T('pairsDownD') : T('pairsUpD'));
}

/* ---------------- Activity: What goes together ---------------- */
function modTogether(){
  var L=lvl('together'), nc=L+1, p=pickFresh('tog', TOG);
  newRound('together'); var st=setStage();
  var row = div('tgtRow');
  row.appendChild(card(p.a, 'div'));
  row.appendChild(div('plusq','+ ?'));
  st.appendChild(row);
  var right = p.b;
  var opts = [right].concat(shuffle(NEUTRAL.slice()).slice(0, nc-1));
  var order = shuffle(opts.slice());
  choices(st, order, order.indexOf(right), F('togH',p.b,p.a));
  ask(F('togQ',p.a));
}

/* ---------------- Activity: Finish the pattern ---------------- */
function modPattern(){
  var L=lvl('pattern'), sy=shuffle(SYM.slice()), a=sy[0], b=sy[1], c=sy[2], seq, ans, nc;
  if(L<3){
    if(Math.random()<0.5){ seq=[a,b,a,b]; ans=a; } else { seq=[a,b,a,b,a]; ans=b; }
    nc = (L===1) ? 2 : 3;
  } else {
    if(Math.random()<0.5){ seq=[a,b,c,a,b]; ans=c; } else { seq=[a,a,b,a,a]; ans=b; }
    nc = 3;
  }
  newRound('pattern'); var st=setStage();
  var row = div('prow');
  seq.forEach(function(x){ row.appendChild(div('pcell', x.e)); });
  var q = div('pcell q', '?'); row.appendChild(q);
  st.appendChild(row);
  var wrong = sy.filter(function(x){ return x!==ans; });
  // prefer a symbol from the pattern as one of the wrong options, so it is a real choice
  var inPat = wrong.filter(function(x){ return seq.indexOf(x)>=0; });
  var outPat = wrong.filter(function(x){ return seq.indexOf(x)<0; });
  var opts = [ans].concat(inPat.concat(outPat).slice(0, nc-1));
  var order = shuffle(opts.slice());
  choices(st, order, order.indexOf(ans), F('patH',ans), function(){
    q.textContent = ans.e; q.classList.add('filled');
  });
  ask(T('pattern'));
}

/* ---------------- Activity: Which one is different ---------------- */
function modOdd(){
  var L=lvl('odd'), keys=Object.keys(CATS), ka, kb;
  if(L===3){ ka = pick(Object.keys(CLOSE)); kb = pick(CLOSE[ka]); }
  else {
    ka = pick(keys);
    do { kb = pick(keys); } while(kb===ka || (CLOSE[ka] && CLOSE[ka].indexOf(kb)>=0) || (CLOSE[kb] && CLOSE[kb].indexOf(ka)>=0));
  }
  var n = (L===1) ? 2 : 3;
  var same = shuffle(CATS[ka].items.slice()).slice(0,n);
  var odd = pick(CATS[kb].items);
  var items = shuffle(same.concat([odd]));
  newRound('odd'); var st=setStage();
  choices(st, items, items.indexOf(odd), F('oddH',odd,CATS[ka].pl));
  ask(T('odd'));
}

/* ---------------- Activity: Put the steps in order ---------------- */
function modSeq(){
  var L=lvl('seq'), s=(L===3) ? pickFresh('s4',SEQ4) : pickFresh('s3',SEQ3), pre=(L!==2);
  var steps = s.s.map(function(x,i){ return { e:x[0], n:x[1], i:i }; });
  var n=steps.length, p=0;
  newRound('seq'); var me=R, st=setStage();
  var slots=div('slots'), sl=[];
  for(var i=0;i<n;i++){ var d=div('slot', String(i+1)); slots.appendChild(d); sl.push(d); }
  st.appendChild(slots);
  function fill(i){ var d=sl[i]; d.className='slot full'; d.innerHTML=''; d.appendChild(div('se', steps[i].e)); d.appendChild(div('sn', String(i+1))); }
  if(pre){ fill(0); p=1; }
  var rem = shuffle(steps.slice(p)), g=mkGrid(st, rem.length), btns={};
  rem.forEach(function(it){
    var b=card(it); btns[it.i]=b; g.appendChild(b);
    onTap(b, function(){ if(me.done || b._used) return; tick(); if(it.i===p) place(); else miss(); });
  });
  function place(){
    var b=btns[p]; b._used=true; b.classList.add('used'); fill(p); stepOk();
    var said = steps[p].n + '.'; p++;
    if(p>=n){ roundDone(); return; }
    softChime();
    me.instr = T('next');
    $('prompt').textContent = s.t + '. ' + T('next');
    say(said + ' ' + T('next')); armIdle();
  }
  me.hint = function(l){
    if(p>=n) return;
    glow([btns[p]]);
    if(l>=2) say(F('seqHint',steps[p].n));
    if(l>=3) setTimeout(function(){ if(R===me && !me.done && !btns[p]._used) place(); }, 2600);
  };
  if(pre) ask(F('seqPre',s.t,steps[0].n), s.t+'. '+T('next'));
  else ask(s.t+'. '+T('first'));
}

  days.forEach(function(x){ bars += '<div class="bcol"><div class="bar" style="height:'+Math.round(100*x.r.s/mx)+'%"></div><div class="bday">'+'SMTWTFS'.charAt(x.d.getDay())+'</div></div>'; });

function renderPhotoList(){
  var l=$('phList'); if(!l) return; l.innerHTML='';
  if(!PHOTOS.length){ l.appendChild(div('note','No photos yet. The family photo activity starts once you add at least one.')); return; }
  PHOTOS.forEach(function(p){
    var r=div('ph'); var im=document.createElement('img'); im.src=p.data; im.alt=''; r.appendChild(im);
    r.appendChild(div('nm', p.name));
    var x=document.createElement('button'); x.className='btn bad'; x.textContent='Remove';
    x.onclick=function(){ if(!confirm('Remove this photo of '+p.name+'?')) return; delPhoto(p.id, function(){ loadPhotos(renderPhotoList); }); };
    r.appendChild(x); l.appendChild(r);
  });
  if(PHOTOS.length===1) l.appendChild(div('note','Add a second person to unlock the "Where is...?" game.'));
}
var pendingPhoto = null;
$('photoFile').addEventListener('change', function(){
  var f=this.files && this.files[0]; if(!f) return;
  resizeFile(f, function(data){
    if(!data){ alert('Sorry, that photo could not be read. Please try another one.'); return; }
    pendingPhoto=data; $('phPrev').src=data; $('phName').value=''; $('phForm').style.display='flex';
    setTimeout(function(){ $('phName').focus(); }, 100);
  });
});
function savePendingPhoto(){
  var name=$('phName').value.trim();
  if(!pendingPhoto) return;
  if(!name){ alert('Please type the name you want her to hear.'); return; }
  var p={ id:Date.now()+'-'+Math.floor(Math.random()*1e6), name:name, data:pendingPhoto, t:Date.now() };
  putPhoto(p, function(ok){
    if(!ok){ alert('The photo could not be saved. The phone may be low on space.'); return; }
    pendingPhoto=null; $('phForm').style.display='none'; loadPhotos(renderPhotoList);
  });
}
function resizeFile(file, cb){
  var url; try{ url=URL.createObjectURL(file); }catch(e){ cb(null); return; }
  var img=new Image();
  img.onload=function(){
    var m=900, w=img.naturalWidth, h=img.naturalHeight, s=Math.min(1, m/Math.max(w,h));
    var cv=document.createElement('canvas'); cv.width=Math.round(w*s); cv.height=Math.round(h*s);
    cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
    URL.revokeObjectURL(url);
    try{ cb(cv.toDataURL('image/jpeg',0.82)); }catch(e){ cb(null); }
  };
  img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
  img.src=url;
}
